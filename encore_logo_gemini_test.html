<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Encore Logo Ribbon Animation Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle, #2b2525 0%, #0e0c0c 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    .instruction {
      margin-bottom: 24px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
    }
    .app-icon {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle at 30% 25%, #9b1828, #580a14);
      border-radius: 64px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.65), inset 0 2px 3px rgba(255,255,255,0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .app-icon:active {
      transform: scale(0.96);
    }
    svg {
      width: 170px;
      height: 170px;
      overflow: visible;
      filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.45));
    }
    .ribbon {
      transform-origin: center center;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

<p class="instruction">Klikni na ikonu pre spustenie animácie rozpojenia a spojenia:</p>

<div class="app-icon" id="logo-button">
  <svg viewBox="0 0 200 240">
    <defs>
      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff3c4"/>
        <stop offset="25%" stop-color="#dfb974"/>
        <stop offset="50%" stop-color="#b88437"/>
        <stop offset="75%" stop-color="#f5dfa0"/>
        <stop offset="100%" stop-color="#93641e"/>
      </linearGradient>
    </defs>

    <path id="male-half" class="ribbon"
          d="M 100,210 
             C 70,210 42,185 42,145 
             C 42,110 58,95 58,75 
             C 58,50 82,35 105,35 
             C 100,50 85,55 78,72 
             C 70,90 92,105 110,118
             M 50,122 C 68,122 84,116 92,116" 
          stroke="url(#goldGradient)" 
          stroke-width="15"/>

    <path id="female-half" class="ribbon"
          d="M 100,210 
             C 125,205 140,180 136,155 
             C 130,130 115,124 116,108 
             C 117,92 126,88 126,76 
             C 126,62 114,48 108,40
             M 116,108 C 128,112 136,98 132,84" 
          stroke="url(#goldGradient)" 
          stroke-width="14"/>
  </svg>
</div>

<script>
  let isAnimating = false;

  document.getElementById("logo-button").addEventListener("click", () => {
    if (isAnimating) return;
    isAnimating = true;

    const tl = gsap.timeline({
      onComplete: () => {
        isAnimating = false;
      }
    });

    // 1. Rozpojenie v spodnom bode a oddialenie dvoch entít
    tl.to("#male-half", {
      x: -45,
      y: -10,
      rotation: -16,
      skewX: 10,
      strokeWidth: 9,
      duration: 1.2,
      ease: "power2.out"
    }, 0)
    .to("#female-half", {
      x: 45,
      y: 12,
      rotation: 18,
      skewX: -10,
      strokeWidth: 8,
      duration: 1.2,
      ease: "power2.out"
    }, 0)

    // 2. Vlnivý prehyb vo vzduchu (Ribbon float / dance wave)
    .to("#male-half", {
      y: "+=16",
      rotation: -8,
      skewX: -6,
      duration: 0.9,
      ease: "sine.inOut"
    }, ">-0.2")
    .to("#female-half", {
      y: "-=16",
      rotation: 8,
      skewX: 6,
      duration: 0.9,
      ease: "sine.inOut"
    }, "<")

    // 3. Spojenie naspäť do pôvodného pevného celku (Snap back to original)
    .to("#male-half", {
      x: 0,
      y: 0,
      rotation: 0,
      skewX: 0,
      strokeWidth: 15,
      duration: 1.0,
      ease: "back.out(1.4)"
    }, ">+0.1")
    .to("#female-half", {
      x: 0,
      y: 0,
      rotation: 0,
      skewX: 0,
      strokeWidth: 14,
      duration: 1.0,
      ease: "back.out(1.4)"
    }, "<");
  });
</script>

</body>
</html>
